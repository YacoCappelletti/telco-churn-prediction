services:
  api:
    build: .
    command: python -m uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8010:8000"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MODEL_VERSION=${MODEL_VERSION:-1.0.0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3

  predict_app:
    build: .
    command: python -m streamlit run apps/predict_app/app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    ports:
      - "8511:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy

  dashboard:
    build: .
    command: python -m streamlit run apps/dashboard/app.py --server.address 0.0.0.0 --server.port 8502 --server.headless true
    ports:
      - "8512:8502"
